# ArgoCD Application: visits-service in prod (PETPLAT-114). Manual sync only:
#   argocd app sync visits-service-prod
# releaseName must equal the service name: the chart uses .Release.Name for
# resource names (Service DNS) and the perService lookup in prod.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: visits-service-prod
  namespace: argocd
  labels:
    app.kubernetes.io/name: visits-service
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    environment: prod
spec:
  project: default
  source:
    repoURL: https://github.com/adrifok/agentic-petclinic-platform.git
    targetRevision: main
    path: helm/petclinic-service
    helm:
      releaseName: visits-service
      valueFiles:
        - ../../helm-values/visits-service.yaml
        - ../../helm-values/prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: petclinic-prod
  syncPolicy:
    # Labels for a namespace ArgoCD creates (CreateNamespace alone sets none),
    # so PSA restricted applies even if namespaces.yaml was not applied (PET-10).
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/part-of: petclinic
        environment: prod
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
