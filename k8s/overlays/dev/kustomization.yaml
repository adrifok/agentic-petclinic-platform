# Dev overlay (PETPLAT-45). Per docs/technical-spec.md#kubernetes-overlays:
# namespace petclinic-dev, all services at 1 replica (already the base
# default — no replica patch needed here).
#
# images: resolves the base's literal "{env}" placeholder
# (284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-{env}/<service>)
# to petclinic-dev — required, not optional: kubectl treats "{" and "}" as
# invalid image-reference characters, so applying the base directly
# (bypassing this overlay) fails every pod with InvalidImageName. Tag
# v1.0.0 is real — pushed via ./mvnw clean install -P buildDocker
# -Dcontainer.platform=linux/arm64, confirmed live in all 8 dev ECR repos.
# Bump per service with `kustomize edit set image <service>=...:<new-tag>`
# once CI/CD (PETPLAT-85) starts pushing SHA-tagged images.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: petclinic-dev

resources:
  - ../../base

images:
  - name: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-{env}/config-server
    newName: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/config-server
  - name: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-{env}/discovery-server
    newName: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/discovery-server
  - name: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-{env}/api-gateway
    newName: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/api-gateway
  - name: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-{env}/customers-service
    newName: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/customers-service
  - name: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-{env}/visits-service
    newName: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/visits-service
  - name: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-{env}/vets-service
    newName: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/vets-service
  - name: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-{env}/genai-service
    newName: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/genai-service
  - name: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-{env}/admin-server
    newName: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/admin-server
