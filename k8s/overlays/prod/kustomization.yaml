# Prod overlay (PETPLAT-46, PETPLAT-47). Per
# docs/technical-spec.md#kubernetes-overlays: namespace petclinic-prod,
# replicas=2 for config-server/discovery-server/api-gateway/
# customers-service/visits-service/vets-service (HA); genai-service and
# admin-server stay at the base default of 1 (cost saving / single-replica
# tool). HPA covers the 5 stateless/scalable services — requires Metrics
# Server on the prod EKS cluster (PETPLAT-72).
#
# images: resolves the base's literal "{env}" placeholder to petclinic-prod
# — required, not optional, same reasoning as k8s/overlays/dev (kubectl
# rejects "{"/"}" in an image reference, so the base is not directly
# applicable on its own). Tag v1.0.0 here is NOT yet real — no image has
# been pushed to any petclinic-prod/* ECR repo. Pods will sit in
# ImagePullBackOff (a normal/expected pull failure) rather than
# InvalidImageName (a malformed reference) until a real prod image is
# pushed and this tag is bumped with `kustomize edit set image`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: petclinic-prod

resources:
  - ../../base
  - hpa/api-gateway-hpa.yaml
  - hpa/customers-service-hpa.yaml
  - hpa/visits-service-hpa.yaml
  - hpa/vets-service-hpa.yaml
  - hpa/genai-service-hpa.yaml

images:
  - name: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-{env}/config-server
    newName: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-prod/config-server
  - name: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-{env}/discovery-server
    newName: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-prod/discovery-server
  - name: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-{env}/api-gateway
    newName: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-prod/api-gateway
  - name: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-{env}/customers-service
    newName: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-prod/customers-service
  - name: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-{env}/visits-service
    newName: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-prod/visits-service
  - name: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-{env}/vets-service
    newName: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-prod/vets-service
  - name: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-{env}/genai-service
    newName: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-prod/genai-service
  - name: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-{env}/admin-server
    newName: 284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-prod/admin-server

replicas:
  - name: config-server
    count: 2
  - name: discovery-server
    count: 2
  - name: api-gateway
    count: 2
  - name: customers-service
    count: 2
  - name: visits-service
    count: 2
  - name: vets-service
    count: 2
