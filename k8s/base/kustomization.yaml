# Base for the 8 application services (PETPLAT-38 through PETPLAT-44).
# Namespace-agnostic — overlays (k8s/overlays/{dev,prod}) set the namespace
# and per-env replica counts/images. Does NOT include external-secrets/ or
# ingress/ — those already ship fully rendered per-env
# (docs/technical-spec.md#kubernetes-overlays: "k8s/overlays/ remains for
# namespace manifests and external-secrets CRs that are not Helm-managed").
#
# namespaces.yaml is deliberately NOT listed here: Kustomize's overlay
# `namespace:` transformer rewrites a Namespace object's own metadata.name
# (it has no metadata.namespace to set instead), so running both dev and
# prod overlays through the same base would rename both Namespace objects
# to the same target name and collide. Namespaces are cluster-level and
# applied once, directly — not per-env — so they stay a standalone file:
#   kubectl apply -f k8s/base/namespaces.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - config-server
  - discovery-server
  - customers-service
  - visits-service
  - vets-service
  - genai-service
  - api-gateway
  - admin-server
