# Master + per-service credentials, readable only inside this namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-bootstrap-credentials
  namespace: petclinic-db-bootstrap
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: db-bootstrap-credentials
  data:
    - secretKey: MASTER_USER
      remoteRef: { key: petclinic/prod/rds-credentials, property: username }
    - secretKey: MASTER_PASSWORD
      remoteRef: { key: petclinic/prod/rds-credentials, property: password }
    - secretKey: CUSTOMERS_PASSWORD
      remoteRef: { key: petclinic/prod/db-customers, property: password }
    - secretKey: VISITS_PASSWORD
      remoteRef: { key: petclinic/prod/db-visits, property: password }
    - secretKey: VETS_PASSWORD
      remoteRef: { key: petclinic/prod/db-vets, property: password }
