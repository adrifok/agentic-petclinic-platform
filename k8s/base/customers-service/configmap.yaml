# SPRING_DATASOURCE_URL below is dev's live RDS endpoint (as of the last
# fill). It will go stale the next time the RDS instance is recreated (dev
# is torn down/rebuilt regularly) — re-fill with:
#   sed -i "s|<old-endpoint>|$(terraform -chdir=terraform/environments/dev output -raw rds_endpoint)|" \
#     k8s/base/customers-service/configmap.yaml
# Same convention as k8s/base/ingress/ingress.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: customers-service-config
  labels:
    app.kubernetes.io/name: customers-service
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: service
data:
  SPRING_PROFILES_ACTIVE: "docker,mysql"
  CONFIG_SERVER_URL: "http://config-server:8888"
  SPRING_DATASOURCE_URL: "jdbc:mysql://petclinic-dev-mysql.c9eeoak8as0x.eu-central-1.rds.amazonaws.com:3306/petclinic"
