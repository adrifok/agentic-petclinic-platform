# ExternalSecret: rds-credentials (prod)
#
# Syncs the RDS master credentials (Secrets Manager secret
# petclinic/prod/rds-credentials, created by the rds module — PETPLAT-23) into
# a K8s Secret named rds-credentials in petclinic-prod, with keys `username`
# and `password`. Consumed by customers-service, visits-service, and
# vets-service as SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
# (PETPLAT-41).
#
# Prod counterpart of rds-credentials.yaml (dev) — implements PETPLAT-35 for
# petclinic-prod, now that the prod rds module and prod ESO IRSA role
# (petclinic-prod-eso-role — PETPLAT-37) both exist. Apply after
# scripts/install-external-secrets.sh prod. See
# docs/technical-spec.md#secrets-management.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rds-credentials
  namespace: petclinic-prod
  labels:
    app.kubernetes.io/name: rds-credentials
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: infrastructure
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: rds-credentials
  data:
    - secretKey: username
      remoteRef:
        key: petclinic/prod/rds-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: petclinic/prod/rds-credentials
        property: password
