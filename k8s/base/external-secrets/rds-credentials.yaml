# ExternalSecret: rds-credentials
#
# Syncs the RDS master credentials (Secrets Manager secret
# petclinic/dev/rds-credentials, created by the rds module — PETPLAT-23) into
# a K8s Secret named rds-credentials with keys `username` and `password`.
# Consumed by customers-service, visits-service, and vets-service as
# SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD (PETPLAT-41).
#
# Implements PETPLAT-35, for petclinic-dev. See rds-credentials-prod.yaml for
# the petclinic-prod counterpart. See docs/technical-spec.md#secrets-management.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-credentials
  namespace: petclinic-dev
  labels:
    app.kubernetes.io/name: rds-credentials
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: infrastructure
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: rds-credentials
  data:
    - secretKey: username
      remoteRef:
        key: petclinic/dev/rds-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: petclinic/dev/rds-credentials
        property: password
