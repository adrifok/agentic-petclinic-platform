# ExternalSecrets: per-service DB credentials (prod, PET-8)
#
# Sync petclinic/prod/db-{customers,visits,vets} (created by the rds module)
# into K8s Secrets db-<svc> in petclinic-prod, consumed via perService
# secretEnv in helm-values/prod.yaml. The MySQL users behind them are created
# by k8s/base/db-bootstrap. The master user is not exposed to this namespace.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-customers
  namespace: petclinic-prod
  labels:
    app.kubernetes.io/name: db-customers
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: infrastructure
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: db-customers
  dataFrom:
    - extract:
        key: petclinic/prod/db-customers
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-visits
  namespace: petclinic-prod
  labels:
    app.kubernetes.io/name: db-visits
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: infrastructure
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: db-visits
  dataFrom:
    - extract:
        key: petclinic/prod/db-visits
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-vets
  namespace: petclinic-prod
  labels:
    app.kubernetes.io/name: db-vets
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: infrastructure
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: db-vets
  dataFrom:
    - extract:
        key: petclinic/prod/db-vets
