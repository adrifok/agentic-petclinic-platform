# ClusterSecretStore: aws-secrets-manager
#
# Cluster-scoped — one per cluster, referenced by every ExternalSecret's
# secretStoreRef. Points External Secrets Operator at AWS Secrets Manager in
# eu-central-1, authenticating as the external-secrets-sa ServiceAccount via
# IRSA (petclinic-{env}-eso-role — PETPLAT-37). Identical for dev and prod:
# each is a separate EKS cluster/ServiceAccount, but the store's shape
# (namespace, service account name, region) doesn't differ between them.
#
# Applied by scripts/install-external-secrets.sh after the ESO Helm release
# (PETPLAT-34). See docs/technical-spec.md#secrets-management.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: infrastructure
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
