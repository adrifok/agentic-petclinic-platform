# ExternalSecrets for the observability stack (dev). Both Secrets Manager
# secrets live under petclinic/dev/*, which the ESO IRSA role can already read,
# so no Terraform/IAM change is needed. Create them once per environment
# before applying this directory (values never go in Git):
#
#   aws secretsmanager create-secret --region eu-central-1 \
#     --name petclinic/dev/grafana-admin \
#     --secret-string "{\"username\":\"admin\",\"password\":\"$(openssl rand -base64 24)\"}"
#   aws secretsmanager create-secret --region eu-central-1 \
#     --name petclinic/dev/alertmanager-slack \
#     --secret-string '{"webhook_url":"https://hooks.slack.com/services/XXX/YYY/ZZZ"}'
#
# Prod (PET-14): no copy; the render in docs/runbooks/prod-bootstrap.md swaps
# petclinic/dev/ for petclinic/prod/ at apply time.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana-admin
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: observability
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: grafana-admin
  data:
    - secretKey: admin-user
      remoteRef:
        key: petclinic/dev/grafana-admin
        property: username
    - secretKey: admin-password
      remoteRef:
        key: petclinic/dev/grafana-admin
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager-slack
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: observability
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: alertmanager-slack
  data:
    # Mounted as a file and read via slack_configs.api_url_file, so the
    # webhook URL never appears in the Alertmanager ConfigMap.
    - secretKey: webhook-url
      remoteRef:
        key: petclinic/dev/alertmanager-slack
        property: webhook_url
