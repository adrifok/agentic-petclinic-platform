# FluentBit (PETPLAT-59) — docs/technical-spec.md#fluentbit-logging
#
# DaemonSet on every node. Tails container logs of the petclinic-* namespaces,
# enriches them with Kubernetes metadata and ships them to Loki at
# http://loki.monitoring:3100 with labels namespace, pod, container.
# No IRSA / ServiceAccount annotation: Loki is in-cluster, no AWS API calls.
# The ServiceAccount only needs read access to pods/namespaces for the
# kubernetes filter.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: monitoring
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: observability
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: observability
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush                     5
        Log_Level                 warn
        Daemon                    off
        HTTP_Server               On
        HTTP_Listen               0.0.0.0
        HTTP_Port                 2020
        Health_Check              On
        storage.path              /var/fluent-bit/state/buffer

    # Kubelet log file name: <pod>_<namespace>_<container>-<id>.log
    [INPUT]
        Name                      tail
        Tag                       kube.*
        Path                      /var/log/containers/*_petclinic-*_*.log
        multiline.parser          cri
        DB                        /var/fluent-bit/state/flb_kube.db
        Mem_Buf_Limit             5MB
        Skip_Long_Lines           On
        Refresh_Interval          10

    [FILTER]
        Name                      kubernetes
        Match                     kube.*
        Kube_URL                  https://kubernetes.default.svc:443
        Kube_Tag_Prefix           kube.var.log.containers.
        Merge_Log                 Off
        Labels                    Off
        Annotations               Off

    # Output: Loki at http://loki.monitoring:3100
    # Labels are extracted before remove_keys runs; after removal only `log`
    # is left, so drop_single_key sends the raw log line.
    [OUTPUT]
        Name                      loki
        Match                     kube.*
        Host                      loki.monitoring
        Port                      3100
        Uri                       /loki/api/v1/push
        tls                       off
        labels                    job=fluent-bit, namespace=$kubernetes['namespace_name'], pod=$kubernetes['pod_name'], container=$kubernetes['container_name']
        remove_keys               kubernetes, stream, _p, time
        drop_single_key           raw
        line_format               json
        Retry_Limit               5
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: monitoring
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit
        app.kubernetes.io/part-of: petclinic
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: observability
    spec:
      serviceAccountName: fluent-bit
      # A DaemonSet pod is pinned to its node; without a high priority it
      # stays Pending when that node is full (seen on dev 2026-09-29).
      priorityClassName: system-node-critical
      # Run on every node, including tainted ones.
      tolerations:
        - operator: Exists
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.1.2
          args:
            - --config=/fluent-bit/etc/conf/fluent-bit.conf
          ports:
            - name: http
              containerPort: 2020
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          # Root (uid 0) is required to read /var/log/pods (root-owned 0640);
          # no capabilities, read-only root FS, host log dirs mounted read-only.
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/conf
              readOnly: true
            - name: varlogcontainers
              mountPath: /var/log/containers
              readOnly: true
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: state
              mountPath: /var/fluent-bit/state
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
        - name: varlogcontainers
          hostPath:
            path: /var/log/containers
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        # Tail offsets survive pod restarts so logs aren't re-shipped.
        - name: state
          hostPath:
            path: /var/fluent-bit/state
            type: DirectoryOrCreate
