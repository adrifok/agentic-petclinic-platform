# Namespaces for the observability stack (E-11).
#   monitoring: Prometheus, Alertmanager, Grafana, Loki, FluentBit
#   tracing:    Zipkin (apps send spans to http://zipkin.tracing:9411)
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    # privileged: fluent-bit needs hostPath (/var/log), which baseline
    # rejects. warn/audit still flag anything beyond baseline (PET-10).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: tracing
  labels:
    app.kubernetes.io/name: tracing
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
