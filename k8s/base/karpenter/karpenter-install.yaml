# Karpenter controller install (PETPLAT-73) — dev.
#
# Documentation only: Karpenter is installed with Helm, not kubectl apply.
# This file has no Kubernetes objects; `kubectl apply -f` on it fails with
# "no objects passed to apply".
#
# Namespace: kube-system. ServiceAccount: karpenter (IRSA, created by the chart).
#
# Version 1.14.1, not the 1.0.0 in the original prompt: Karpenter's
# compatibility matrix requires >= 1.13 for Kubernetes 1.36. The chart
# includes the karpenter.sh / karpenter.k8s.aws CRDs.
#
# Values below are the dev Terraform outputs (terraform/environments/dev):
#   cluster_name                    = petclinic-dev
#   karpenter_queue_name            = petclinic-dev-karpenter-interruption
#   karpenter_role_arn              = arn:aws:iam::284495578524:role/petclinic-dev-karpenter-role
#   karpenter_instance_profile_name = petclinic-dev-karpenter-node-profile (used in nodepool.yaml)
# Confirm after apply with: terraform output (in terraform/environments/dev).
#
# The chart sets no resource requests by default. These are sized for the
# memory-bound t4g.small nodes. replicas=1 in dev saves memory; leader
# election makes 2 safe for prod. The chart's default affinity keeps the
# controller off Karpenter-launched nodes, so it runs on the managed node group.
#
# Install / upgrade (idempotent):
#
#   helm upgrade --install karpenter oci://public.ecr.aws/karpenter/karpenter \
#     --version 1.14.1 \
#     --namespace kube-system \
#     --set settings.clusterName=petclinic-dev \
#     --set settings.interruptionQueue=petclinic-dev-karpenter-interruption \
#     --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=arn:aws:iam::284495578524:role/petclinic-dev-karpenter-role \
#     --set replicas=1 \
#     --set controller.resources.requests.cpu=100m \
#     --set controller.resources.requests.memory=256Mi \
#     --set controller.resources.limits.memory=512Mi \
#     --wait
#
# Same command, values read live from Terraform (run from terraform/environments/dev):
#
#   helm upgrade --install karpenter oci://public.ecr.aws/karpenter/karpenter \
#     --version 1.14.1 \
#     --namespace kube-system \
#     --set settings.clusterName="$(terraform output -raw cluster_name)" \
#     --set settings.interruptionQueue="$(terraform output -raw karpenter_queue_name)" \
#     --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="$(terraform output -raw karpenter_role_arn)" \
#     --set replicas=1 \
#     --set controller.resources.requests.cpu=100m \
#     --set controller.resources.requests.memory=256Mi \
#     --set controller.resources.limits.memory=512Mi \
#     --wait
#
# Metrics Server is the EKS add-on (Terraform), nothing to install here.
#
# Then apply the NodePool + EC2NodeClass:
#   kubectl apply -f k8s/base/karpenter/nodepool.yaml
#
# Verify:
#   kubectl -n kube-system get pods -l app.kubernetes.io/name=karpenter
#   kubectl -n kube-system logs deploy/karpenter -f
#   kubectl get nodepools,ec2nodeclasses,nodeclaims
#
# Uninstall: delete NodePools first so Karpenter drains and terminates its
# own nodes, then helm uninstall. Uninstalling first orphans those EC2 instances.
#   kubectl delete nodepools --all && helm uninstall karpenter -n kube-system
