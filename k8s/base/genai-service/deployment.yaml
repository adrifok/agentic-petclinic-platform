# genai-service (PETPLAT-42) — waits on Config Server and Discovery Server.
# OPENAI_API_KEY comes from the "openai-api-key" K8s Secret synced by ESO
# (k8s/base/external-secrets/openai-api-key.yaml) — that secret only exists
# once a real key is set (terraform/modules/secrets is count-gated on
# openai_api_key being non-empty). If it's unset, this Deployment will sit
# in CreateContainerConfigError until the secret exists — expected while
# genai-service is intentionally skipped.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genai-service
  labels:
    app.kubernetes.io/name: genai-service
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: genai-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: genai-service
        app.kubernetes.io/part-of: petclinic
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: service
    spec:
      serviceAccountName: genai-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-config-server
          image: busybox:1.36
          imagePullPolicy: Always
          command: ['sh', '-c', 'until wget -qO- http://config-server:8888/actuator/health; do sleep 5; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
        - name: wait-for-discovery-server
          image: busybox:1.36
          imagePullPolicy: Always
          command: ['sh', '-c', 'until wget -qO- http://discovery-server:8761/actuator/health; do sleep 5; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
      containers:
        - name: genai-service
          image: "284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-{env}/genai-service:v1.0.0"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8084
          envFrom:
            - configMapRef:
                name: genai-service-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-api-key
                  key: OPENAI_API_KEY
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
