# Prod environment overrides (PETPLAT-46, PETPLAT-47) — merged on top of
# each helm-values/{service}.yaml:
#   helm upgrade --install <service> helm/petclinic-service/ -n petclinic-prod \
#     -f helm-values/<service>.yaml -f helm-values/prod.yaml --set image.tag=<sha>
#
# Replica counts, HPA targets, and PDB settings are NOT blanket values —
# they're per-service, keyed by release name below (`perService`), matching
# docs/technical-spec.md#kubernetes-overlays exactly:
#   - config-server, discovery-server: replicas=2, PDB minAvailable=1, no HPA
#   - api-gateway, customers-service, visits-service, vets-service:
#     replicas=2, HPA (target 70% CPU, different min/max per service), PDB minAvailable=1
#   - genai-service: replicas=1, HPA 1-3 (cost saving), no PDB
#   - admin-server: replicas=1, no HPA, no PDB (single-replica monitoring tool)

image:
  registry: "284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-prod"
  pullPolicy: Always

# Prod RDS doesn't exist yet — refill once it's created:
#   terraform -chdir=terraform/environments/prod output -raw rds_endpoint
datasource:
  url: "<RDS_ENDPOINT>"

perService:
  config-server:
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  discovery-server:
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  api-gateway:
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  customers-service:
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  visits-service:
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  vets-service:
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  genai-service:
    replicaCount: 1
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70

  admin-server:
    replicaCount: 1
