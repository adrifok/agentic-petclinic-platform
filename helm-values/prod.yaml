# Prod environment overrides (PETPLAT-46, PETPLAT-47) — merged on top of
# each helm-values/{service}.yaml by the ArgoCD Applications in
# k8s/argocd/applications/prod/ (valueFiles: <service>.yaml, then prod.yaml).
# Prod is manual sync: `argocd app sync <service>-prod`. To preview a render
# locally:
#   helm template <service> helm/petclinic-service/ \
#     -f helm-values/<service>.yaml -f helm-values/prod.yaml
#
# Replica counts, HPA targets, and PDB settings are NOT blanket values —
# they're per-service, keyed by release name below (`perService`), matching
# docs/technical-spec.md#kubernetes-overlays exactly:
#   - config-server, discovery-server: replicas=2, PDB minAvailable=1, no HPA
#   - api-gateway, customers-service, visits-service, vets-service:
#     replicas=2, HPA (target 70% CPU, different min/max per service), PDB minAvailable=1
#   - genai-service: replicas=1, HPA 1-3 (cost saving), no PDB
#   - admin-server: replicas=1, no HPA, no PDB (single-replica monitoring tool)

image:
  registry: "284495578524.dkr.ecr.eu-central-1.amazonaws.com/petclinic-prod"
  pullPolicy: Always

# Prod RDS doesn't exist yet. This is a deliberately invalid placeholder —
# the chart (helm/petclinic-service/templates/configmap.yaml) refuses to
# render for any datasource-enabled service while "RDS_ENDPOINT" appears
# here, so an accidental deploy fails loudly at `helm template`/`helm
# install` time instead of silently reaching a broken connection string at
# runtime. Refill once prod RDS exists:
#   sed -i "s|<RDS_ENDPOINT>|$(terraform -chdir=terraform/environments/prod output -raw rds_endpoint)|" \
#     helm-values/prod.yaml
#
# TLS (PET-8): RDS has require_secure_transport=1. VERIFY_IDENTITY checks the
# cert chain and hostname against the truststore built by the chart's
# build-rds-truststore init container. "changeit" only guards public CA certs,
# not a secret.
datasource:
  url: "jdbc:mysql://<RDS_ENDPOINT>:3306/petclinic?sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=file:/certs/rds-truststore.p12&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=changeit"
  tls:
    enabled: true

# NetworkPolicies (PET-9). Kill switch: set enabled: false and sync if a
# missing allow rule breaks traffic. vpcCidr = terraform prod var vpc_cidr.
networkPolicy:
  enabled: true
  vpcCidr: "10.1.0.0/16"

# PET-10: read-only root filesystem + no SA token. Rollback switch: set
# enabled: false and sync if a service fails with "Read-only file system".
hardening:
  enabled: true

# Schema and seed data are loaded once by k8s/base/db-bootstrap (PET-8), so
# per-service DB users only need DML. Env wins over the config-server value
# (mode: ALWAYS) because the config repo sets override-none: true.
configMap:
  SPRING_SQL_INIT_MODE: "never"

perService:
  config-server:
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  discovery-server:
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  api-gateway:
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  customers-service:
    secretEnv:
      - name: SPRING_DATASOURCE_USERNAME
        secretName: db-customers
        secretKey: username
      - name: SPRING_DATASOURCE_PASSWORD
        secretName: db-customers
        secretKey: password
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  visits-service:
    secretEnv:
      - name: SPRING_DATASOURCE_USERNAME
        secretName: db-visits
        secretKey: username
      - name: SPRING_DATASOURCE_PASSWORD
        secretName: db-visits
        secretKey: password
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  vets-service:
    secretEnv:
      - name: SPRING_DATASOURCE_USERNAME
        secretName: db-vets
        secretKey: username
      - name: SPRING_DATASOURCE_PASSWORD
        secretName: db-vets
        secretKey: password
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  # Not run in prod (no OpenAI account, same as dev): 0 replicas, no HPA.
  genai-service:
    replicaCount: 0
    autoscaling:
      enabled: false

  admin-server:
    replicaCount: 1
