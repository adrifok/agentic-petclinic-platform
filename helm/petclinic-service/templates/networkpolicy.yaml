{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- if not $np.vpcCidr }}
{{- fail (printf "%s: networkPolicy.enabled=true needs networkPolicy.vpcCidr (ALB ingress, RDS egress)" .Release.Name) }}
{{- end }}
{{- /* An empty "from" would allow every source, so require at least one. */}}
{{- if not (or $np.ingress.fromNamespace $np.ingress.fromPods $np.ingress.fromVpc $np.ingress.fromMonitoring) }}
{{- fail (printf "%s: networkPolicy.ingress has no sources; an empty from allows everything" .Release.Name) }}
{{- end }}
# Ingress + egress allow-list for this service (PET-9). Anything not listed
# is denied once the VPC CNI network policy agent enforces it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "petclinic-service.fullname" . }}
  labels:
    {{- include "petclinic-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "petclinic-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
      from:
        {{- if $np.ingress.fromNamespace }}
        - podSelector: {}
        {{- end }}
        {{- range $np.ingress.fromPods }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . }}
        {{- end }}
        {{- if $np.ingress.fromVpc }}
        # ALB with target-type ip sends from its VPC addresses. Accepted risk:
        # this also admits any node or pod in the VPC on this port.
        - ipBlock:
            cidr: {{ $np.vpcCidr }}
        {{- end }}
        {{- if $np.ingress.fromMonitoring }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tracing
      ports:
        - port: 9411
          protocol: TCP
    {{- if .Values.datasource.enabled }}
    - to:
        - ipBlock:
            cidr: {{ $np.vpcCidr }}
      ports:
        - port: 3306
          protocol: TCP
    {{- end }}
    {{- if $np.egressInternet }}
    - ports:
        - port: 443
          protocol: TCP
    {{- end }}
{{- end }}
