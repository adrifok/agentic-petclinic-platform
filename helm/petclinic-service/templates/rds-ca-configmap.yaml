{{- if and .Values.datasource.enabled (.Values.datasource.tls | default dict).enabled }}
# Public RDS root CAs for eu-central-1, turned into a PKCS12 truststore by the
# build-rds-truststore init container (PET-8).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "petclinic-service.fullname" . }}-rds-ca
  labels:
    {{- include "petclinic-service.labels" . | nindent 4 }}
data:
  ca.pem: |
    {{- .Files.Get "files/rds-ca-eu-central-1.crt" | nindent 4 }}
{{- end }}
