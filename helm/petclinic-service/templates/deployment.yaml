{{- $override := index (.Values.perService | default dict) .Release.Name | default dict }}
{{- $secretEnv := $override.secretEnv | default .Values.secretEnv }}
{{- $rdsTls := and .Values.datasource.enabled (.Values.datasource.tls | default dict).enabled }}
{{- $hardening := (.Values.hardening | default dict).enabled }}
{{- $securityContext := .Values.securityContext }}
{{- if $hardening }}
{{- $securityContext = merge (dict "readOnlyRootFilesystem" true) .Values.securityContext }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "petclinic-service.fullname" . }}
  labels:
    {{- include "petclinic-service.labels" . | nindent 4 }}
spec:
  {{- /* hasKey, not default: an explicit replicaCount: 0 must be kept. */}}
  replicas: {{ hasKey $override "replicaCount" | ternary $override.replicaCount .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "petclinic-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "petclinic-service.labels" . | nindent 8 }}
      {{- if .Values.podAnnotations }}
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "petclinic-service.fullname" . }}
      {{- if $hardening }}
      # No pod calls the Kubernetes API (discovery is Eureka), PET-10.
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or .Values.initContainers $rdsTls }}
      initContainers:
        {{- range .Values.initContainers }}
        - name: {{ .name }}
          image: {{ $.Values.initContainerImage }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ['sh', '-c', 'until wget -qO- {{ .url }}; do sleep 5; done']
          securityContext:
            {{- toYaml $securityContext | nindent 12 }}
        {{- end }}
        {{- if $rdsTls }}
        # keytool imports one cert per call, so split the PEM bundle first.
        - name: build-rds-truststore
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - >-
              cd /certs &&
              awk '/BEGIN CERT/{n++} {print > ("ca-" n ".pem")}' /rds-ca/ca.pem &&
              for f in ca-*.pem; do
              keytool -importcert -noprompt -alias "${f%.pem}" -file "$f"
              -keystore rds-truststore.p12 -storetype PKCS12 -storepass changeit || exit 1;
              done && rm -f ca-*.pem
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml $securityContext | nindent 12 }}
          volumeMounts:
            - name: rds-ca
              mountPath: /rds-ca
              readOnly: true
            - name: rds-truststore
              mountPath: /certs
        {{- end }}
      {{- end }}
      containers:
        - name: {{ include "petclinic-service.fullname" . }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "petclinic-service.fullname" . }}-config
          {{- if or $secretEnv .Values.env }}
          env:
            {{- range $secretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
            {{- end }}
            {{- range .Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: {{ .Values.service.port }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.service.port }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.service.port }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          securityContext:
            {{- toYaml $securityContext | nindent 12 }}
          {{- if or $rdsTls $hardening }}
          volumeMounts:
            {{- if $rdsTls }}
            - name: rds-truststore
              mountPath: /certs
              readOnly: true
            {{- end }}
            {{- if $hardening }}
            # Writable /tmp for Tomcat/Netty work dirs and genai's vector store temp file.
            - name: tmp
              mountPath: /tmp
            {{- end }}
          {{- end }}
      {{- if or $rdsTls $hardening }}
      volumes:
        {{- if $rdsTls }}
        - name: rds-ca
          configMap:
            name: {{ include "petclinic-service.fullname" . }}-rds-ca
        - name: rds-truststore
          emptyDir: {}
        {{- end }}
        {{- if $hardening }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- end }}
      {{- end }}
